<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Message Sent | Yousef Mohamed Abdelazem</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2353d6b4'/><text x='50%' y='54%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='44' fill='%2307111f'>YA</text></svg>">
  <style>
    .thanks-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 0;
    }
    .thanks-card {
      width: min(calc(100% - 32px), 720px);
      padding: clamp(30px, 6vw, 58px);
      border: 1px solid rgba(83, 214, 180, 0.24);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .thanks-mark {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #031512;
      font-size: 1.8rem;
      font-weight: 900;
    }
    .thanks-card h1 {
      margin-bottom: 16px;
      font-size: clamp(2.2rem, 7vw, 4rem);
    }
    .thanks-card p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: var(--text-soft);
    }
  </style>
</head>
<body>
  <main class="thanks-page">
    <section class="thanks-card" aria-labelledby="thanks-title">
      <div class="thanks-mark" aria-hidden="true">✓</div>
      <p class="section-kicker">Message received</p>
      <h1 id="thanks-title">Thanks for reaching out.</h1>
      <p>Your message was submitted successfully. I will get back to you promptly.</p>
      <a class="button button-primary" href="index.html">Back to Homepage</a>
    </section>
  </main>
</body>
</html>
